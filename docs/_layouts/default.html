<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} | {{ site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <style>
    :root {
      --primary-color: #2563eb;
      --text-color: #1f2937;
      --bg-color: #ffffff;
      --sidebar-bg: #f9fafb;
      --border-color: #e5e7eb;
      --code-bg: #f3f4f6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      line-height: 1.6;
      color: var(--text-color);
      background-color: var(--bg-color);
    }

    .container {
      display: flex;
      min-height: 100vh;
    }

    /* Sidebar */
    .sidebar {
      width: 280px;
      background-color: var(--sidebar-bg);
      border-right: 1px solid var(--border-color);
      padding: 2rem 1.5rem;
      position: fixed;
      height: 100vh;
      overflow-y: auto;
    }

    .sidebar h1 {
      font-size: 1.25rem;
      margin-bottom: 0.5rem;
    }

    .sidebar h1 a {
      color: var(--text-color);
      text-decoration: none;
    }

    .sidebar p {
      font-size: 0.875rem;
      color: #6b7280;
      margin-bottom: 2rem;
    }

    .sidebar nav ul {
      list-style: none;
    }

    .sidebar nav li {
      margin-bottom: 0.5rem;
    }

    .sidebar nav a {
      color: var(--text-color);
      text-decoration: none;
      padding: 0.5rem 0.75rem;
      display: block;
      border-radius: 0.375rem;
      transition: background-color 0.2s;
    }

    .sidebar nav a:hover {
      background-color: var(--border-color);
    }

    .sidebar nav a.active {
      background-color: var(--primary-color);
      color: white;
    }

    /* Main content */
    .main {
      flex: 1;
      margin-left: 280px;
      padding: 3rem 4rem;
      max-width: 900px;
    }

    .main h1 {
      font-size: 2.25rem;
      margin-bottom: 1.5rem;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 0.5rem;
    }

    .main h2 {
      font-size: 1.5rem;
      margin-top: 2.5rem;
      margin-bottom: 1rem;
      color: var(--text-color);
    }

    .main h3 {
      font-size: 1.25rem;
      margin-top: 2rem;
      margin-bottom: 0.75rem;
    }

    .main p {
      margin-bottom: 1rem;
    }

    .main ul, .main ol {
      margin-bottom: 1rem;
      padding-left: 1.5rem;
    }

    .main li {
      margin-bottom: 0.5rem;
    }

    .main a {
      color: var(--primary-color);
      text-decoration: none;
    }

    .main a:hover {
      text-decoration: underline;
    }

    /* Code blocks */
    .main code {
      background-color: var(--code-bg);
      padding: 0.2rem 0.4rem;
      border-radius: 0.25rem;
      font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
      font-size: 0.875rem;
    }

    .main pre {
      background-color: #1f2937;
      color: #e5e7eb;
      padding: 1rem 1.25rem;
      border-radius: 0.5rem;
      overflow-x: auto;
      margin-bottom: 1.5rem;
    }

    .main pre code {
      background-color: transparent;
      padding: 0;
      color: inherit;
    }

    /* Tables */
    .main table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 1.5rem;
    }

    .main th, .main td {
      border: 1px solid var(--border-color);
      padding: 0.75rem 1rem;
      text-align: left;
    }

    .main th {
      background-color: var(--sidebar-bg);
      font-weight: 600;
    }

    .main tr:nth-child(even) {
      background-color: var(--sidebar-bg);
    }

    /* Responsive */
    @media (max-width: 768px) {
      .sidebar {
        width: 100%;
        position: relative;
        height: auto;
      }

      .main {
        margin-left: 0;
        padding: 1.5rem;
      }

      .container {
        flex-direction: column;
      }
    }

    /* Footer */
    .footer {
      margin-top: 4rem;
      padding-top: 2rem;
      border-top: 1px solid var(--border-color);
      font-size: 0.875rem;
      color: #6b7280;
    }
  </style>
</head>
<body>
  <div class="container">
    <aside class="sidebar">
      <h1><a href="{{ '/' | relative_url }}">{{ site.title }}</a></h1>
      <p>{{ site.description }}</p>
      <nav>
        <ul>
          <li><a href="{{ '/' | relative_url }}" {% if page.url == '/' or page.url == '/index.html' %}class="active"{% endif %}>Home</a></li>
          <li><a href="{{ '/getting-started' | relative_url }}" {% if page.url contains 'getting-started' %}class="active"{% endif %}>Getting Started</a></li>
          <li><a href="{{ '/architecture' | relative_url }}" {% if page.url contains 'architecture' %}class="active"{% endif %}>Architecture</a></li>
          <li><a href="{{ '/api-reference' | relative_url }}" {% if page.url contains 'api-reference' %}class="active"{% endif %}>API Reference</a></li>
          <li><a href="{{ '/deployment' | relative_url }}" {% if page.url contains 'deployment' %}class="active"{% endif %}>Deployment</a></li>
          <li><a href="{{ '/development' | relative_url }}" {% if page.url contains 'development' %}class="active"{% endif %}>Development</a></li>
          <li><a href="{{ '/load-testing' | relative_url }}" {% if page.url contains 'load-testing' %}class="active"{% endif %}>Load Testing</a></li>
        </ul>
      </nav>
    </aside>
    <main class="main">
      {{ content }}
      <footer class="footer">
        <p>Fanfinity Infrastructure Documentation</p>
        <p>Built with Jekyll and GitHub Pages</p>
      </footer>
    </main>
  </div>
</body>
</html>
