# =============================================================================
# GitHub Actions CI/CD Pipeline for Football Infrastructure
# =============================================================================
# This workflow builds, tags, and deploys the Go services to AWS EC2.
#
# Triggers:
#   - Push to main branch (builds with 'latest' tag)
#   - Version tags (v*.*.*, builds with version tag)
#   - Manual dispatch (with optional version override)
#
# Required GitHub Secrets (from CloudFormation outputs):
#   - AWS_REGION: AWS region (e.g., us-east-1)
#   - AWS_ACCOUNT_ID: AWS account ID
#   - AWS_ROLE_ARN: IAM role ARN for GitHub Actions
#   - ECR_REGISTRY: ECR registry URL
#   - STACK_NAME: CloudFormation stack name
#   - EC2_INSTANCE_ID: EC2 instance ID for deployment
# =============================================================================

name: Build and Deploy

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0). Leave empty to use latest.'
        required: false
        type: string
      deploy:
        description: 'Deploy after build?'
        required: false
        type: boolean
        default: true

# Prevent concurrent deployments
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
  STACK_NAME: ${{ secrets.STACK_NAME }}

jobs:
  # ===========================================================================
  # BUILD JOB - Build and push Docker images to ECR
  # ===========================================================================
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # Required for OIDC
      contents: read

    outputs:
      version: ${{ steps.version.outputs.version }}
      go_api_image: ${{ steps.build-api.outputs.image }}
      go_consumer_image: ${{ steps.build-consumer.outputs.image }}

    steps:
      # -----------------------------------------------------------------------
      # Checkout and Version Detection
      # -----------------------------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [[ -n "${{ github.event.inputs.version }}" ]]; then
            # Manual dispatch with version override
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            # Version tag (e.g., v1.0.0)
            VERSION="${GITHUB_REF#refs/tags/}"
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            # Main branch - use short SHA
            VERSION="latest"
          else
            # PR or other branch
            VERSION="pr-${{ github.event.pull_request.number || github.sha }}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Version: ${VERSION}"

      # -----------------------------------------------------------------------
      # AWS Authentication via OIDC
      # -----------------------------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: GitHubActions-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # -----------------------------------------------------------------------
      # Set up Docker Buildx for multi-platform builds
      # -----------------------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # -----------------------------------------------------------------------
      # Build and Push go-api
      # -----------------------------------------------------------------------
      - name: Build and push go-api
        id: build-api
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/go-api/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.STACK_NAME }}/go-api:${{ steps.version.outputs.version }}
            ${{ env.ECR_REGISTRY }}/${{ env.STACK_NAME }}/go-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          provenance: false

      - name: Output go-api image
        if: github.event_name != 'pull_request'
        run: |
          echo "image=${{ env.ECR_REGISTRY }}/${{ env.STACK_NAME }}/go-api:${{ steps.version.outputs.version }}" >> $GITHUB_OUTPUT
        id: build-api-output

      # -----------------------------------------------------------------------
      # Build and Push go-consumer
      # -----------------------------------------------------------------------
      - name: Build and push go-consumer
        id: build-consumer
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/go-consumer/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.STACK_NAME }}/go-consumer:${{ steps.version.outputs.version }}
            ${{ env.ECR_REGISTRY }}/${{ env.STACK_NAME }}/go-consumer:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          provenance: false

      - name: Output go-consumer image
        if: github.event_name != 'pull_request'
        run: |
          echo "image=${{ env.ECR_REGISTRY }}/${{ env.STACK_NAME }}/go-consumer:${{ steps.version.outputs.version }}" >> $GITHUB_OUTPUT
        id: build-consumer-output

      # -----------------------------------------------------------------------
      # Build Summary
      # -----------------------------------------------------------------------
      - name: Build summary
        if: github.event_name != 'pull_request'
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Image | Tag |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| go-api | \`${{ steps.version.outputs.version }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| go-consumer | \`${{ steps.version.outputs.version }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # DEPLOY JOB - Deploy to EC2 via SSM
  # ===========================================================================
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build
    if: |
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event.inputs.deploy == 'true')

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: GitHubActions-Deploy-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy via SSM
        id: deploy
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          INSTANCE_ID="${{ secrets.EC2_INSTANCE_ID }}"

          echo "Deploying version ${VERSION} to instance ${INSTANCE_ID}..."

          # Send deployment command via SSM
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --parameters commands="[
              \"cd /opt/football/app\",
              \"echo 'Pulling latest code...'\",
              \"git pull origin main\",
              \"echo 'Updating VERSION in .env...'\",
              \"sed -i 's/^VERSION=.*/VERSION=${VERSION}/' .env\",
              \"echo 'Logging into ECR...'\",
              \"aws ecr get-login-password --region ${AWS_REGION} | docker login --username AWS --password-stdin ${ECR_REGISTRY}\",
              \"echo 'Pulling new images...'\",
              \"docker pull ${ECR_REGISTRY}/${STACK_NAME}/go-api:${VERSION}\",
              \"docker pull ${ECR_REGISTRY}/${STACK_NAME}/go-consumer:${VERSION}\",
              \"echo 'Deploying services...'\",
              \"./scripts/deploy.sh go-api go-consumer\",
              \"echo 'Deployment complete!'\",
              \"docker service ls\"
            ]" \
            --timeout-seconds 300 \
            --output text \
            --query "Command.CommandId")

          echo "Command ID: ${COMMAND_ID}"
          echo "command_id=${COMMAND_ID}" >> $GITHUB_OUTPUT

          # Wait for command to complete
          echo "Waiting for deployment to complete..."
          aws ssm wait command-executed \
            --command-id "${COMMAND_ID}" \
            --instance-id "${INSTANCE_ID}" || true

          # Get command output
          RESULT=$(aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" \
            --instance-id "${INSTANCE_ID}" \
            --query "[Status, StatusDetails, StandardOutputContent, StandardErrorContent]" \
            --output json)

          STATUS=$(echo $RESULT | jq -r '.[0]')
          STATUS_DETAILS=$(echo $RESULT | jq -r '.[1]')
          STDOUT=$(echo $RESULT | jq -r '.[2]')
          STDERR=$(echo $RESULT | jq -r '.[3]')

          echo "Status: ${STATUS}"
          echo "Details: ${STATUS_DETAILS}"

          if [[ "${STATUS}" == "Success" ]]; then
            echo "Deployment successful!"
            echo "::notice::Deployment of version ${VERSION} completed successfully"
          else
            echo "Deployment failed!"
            echo "STDOUT: ${STDOUT}"
            echo "STDERR: ${STDERR}"
            exit 1
          fi

      - name: Deployment summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** \`${{ needs.build.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Instance:** \`${{ secrets.EC2_INSTANCE_ID }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** Success" >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # CREATE RELEASE (only for version tags)
  # ===========================================================================
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build, deploy]
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.build.outputs.version }}
          name: Release ${{ needs.build.outputs.version }}
          body: |
            ## Docker Images

            - `${{ env.ECR_REGISTRY }}/${{ env.STACK_NAME }}/go-api:${{ needs.build.outputs.version }}`
            - `${{ env.ECR_REGISTRY }}/${{ env.STACK_NAME }}/go-consumer:${{ needs.build.outputs.version }}`

            ## Deployment

            This release has been automatically deployed to the EC2 instance.

            ## Changelog

            See commit history for changes since the last release.
          draft: false
          prerelease: ${{ contains(needs.build.outputs.version, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
