name: CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        working-directory:
          - apps/api
          - apps/consumer

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.6
          working-directory: ${{ matrix.working-directory }}

  test:
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run tests in devcontainer
        uses: devcontainers/ci@v0.3
        with:
          runCmd: |
            echo "=== Running health check to initialize services ==="
            bash /workspace/.devcontainer/health-check.sh

            echo ""
            echo "=== Building API ==="
            go build -o /tmp/api .

            echo ""
            echo "=== Building Consumer ==="
            cd /workspace/apps/consumer && go build -o /tmp/consumer .

            echo ""
            echo "=== Running API tests with coverage ==="
            cd /workspace/apps/api && go test -v -coverprofile=/workspace/coverage-api.out ./...

            echo ""
            echo "=== Running Consumer tests with coverage ==="
            cd /workspace/apps/consumer && go test -v -coverprofile=/workspace/coverage-consumer.out ./...

            echo ""
            echo "=== Merging coverage reports ==="
            cd /workspace
            echo "mode: set" > coverage.out
            tail -n +2 coverage-api.out >> coverage.out
            tail -n +2 coverage-consumer.out >> coverage.out
            
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.out

  sonarcloud:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: coverage-report

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
