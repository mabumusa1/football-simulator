name: CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        working-directory:
          - apps/api
          - apps/consumer

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.6
          working-directory: ${{ matrix.working-directory }}

  test:
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run tests in devcontainer
        uses: devcontainers/ci@v0.3
        with:
          runCmd: |
            echo "=== Running health check to initialize services ==="
            bash /workspace/.devcontainer/health-check.sh

            echo ""
            echo "=== Building API ==="
            go build -o /tmp/api .

            echo ""
            echo "=== Building Consumer ==="
            cd /workspace/apps/consumer && go build -o /tmp/consumer .

            echo ""
            echo "=== Running API tests with coverage ==="
            cd /workspace/apps/api && go test -v -coverprofile=/workspace/coverage-api.out ./...

            echo ""
            echo "=== Running Consumer tests with coverage ==="
            cd /workspace/apps/consumer && go test -v -coverprofile=/workspace/coverage-consumer.out ./...

            echo ""
            echo "=== Merging coverage reports ==="
            cd /workspace
            echo "mode: set" > coverage.out
            tail -n +2 coverage-api.out >> coverage.out
            tail -n +2 coverage-consumer.out >> coverage.out

            echo ""
            echo "=== Starting API server for integration test ==="
            export SERVER_HOST=0.0.0.0
            export SERVER_PORT=8080
            export API_KEY=ci-test-key
            export KAFKA_BOOTSTRAP_SERVERS=kafka:29092
            export KAFKA_TOPIC_EVENTS=football_simulator.events
            export CLICKHOUSE_HOST=clickhouse
            export CLICKHOUSE_PORT=9000
            export CLICKHOUSE_DATABASE=football_simulator
            export CLICKHOUSE_USER=default
            export CLICKHOUSE_PASSWORD=""

            /tmp/api &
            sleep 5

            echo ""
            echo "=== Integration test: Health check ==="
            curl -sf http://localhost:8080/health || exit 1

            echo ""
            echo "=== Integration test: Event ingestion ==="
            curl -sf -X POST http://localhost:8080/api/events \
              -H "Content-Type: application/json" \
              -H "X-API-Key: ci-test-key" \
              -d '{"eventId":"11111111-1111-1111-1111-111111111111","matchId":"ci_test","eventType":"goal","teamId":1,"playerId":"p1","timestamp":"2026-01-01T00:00:00Z"}' || exit 1

            echo ""
            echo "=== All tests passed ==="

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.out

  sonarcloud:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: coverage-report

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
