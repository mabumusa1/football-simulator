name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'LICENSE'
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        working-directory:
          - apps/api
          - apps/consumer

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true
          cache-dependency-path: ${{ matrix.working-directory }}/go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.6
          working-directory: ${{ matrix.working-directory }}

  test:
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run tests in devcontainer
        id: tests
        uses: devcontainers/ci@v0.3
        with:
          runCmd: |
            echo "=== Running health check to initialize services ==="
            bash /workspace/.devcontainer/health-check.sh

            echo ""
            echo "=== Building API ==="
            go build -o /tmp/api .

            echo ""
            echo "=== Building Consumer ==="
            cd /workspace/apps/consumer && go build -o /tmp/consumer .

            echo ""
            echo "=== Running API tests with coverage ==="
            cd /workspace/apps/api && go test -v -coverprofile=/workspace/coverage-api.out -json ./... > /workspace/test-api.json 2>&1 || true
            cd /workspace/apps/api && go test -v -coverprofile=/workspace/coverage-api.out ./...

            echo ""
            echo "=== Running Consumer tests with coverage ==="
            cd /workspace/apps/consumer && go test -v -coverprofile=/workspace/coverage-consumer.out -json ./... > /workspace/test-consumer.json 2>&1 || true
            cd /workspace/apps/consumer && go test -v -coverprofile=/workspace/coverage-consumer.out ./...

            echo ""
            echo "=== Merging coverage reports ==="
            cd /workspace
            echo "mode: set" > coverage.out
            tail -n +2 coverage-api.out >> coverage.out
            tail -n +2 coverage-consumer.out >> coverage.out

            echo ""
            echo "=== Generating coverage summary ==="
            go tool cover -func=coverage.out | tail -1 | awk '{print "COVERAGE=" $3}' >> $GITHUB_OUTPUT

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.out

      - name: Add PR comment with results
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: test-results
          message: |
            ## 🧪 Test Results

            | App | Status |
            |-----|--------|
            | API | ✅ Passed |
            | Consumer | ✅ Passed |

            **Coverage:** See SonarCloud for detailed coverage report.

            ---
            *Commit: ${{ github.sha }}*

  sonarcloud:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: coverage-report

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
