# SonarCloud Configuration
sonar.projectKey=mabumusa1_football-simulator
sonar.organization=mabumusa

# Project metadata
sonar.projectName=football-simulator
sonar.projectVersion=1.0

# Source directories
sonar.sources=apps/api,apps/consumer

# Encoding
sonar.sourceEncoding=UTF-8

# Go coverage report
sonar.go.coverage.reportPaths=coverage.out

# Exclusions from analysis (test files, vendor)
sonar.exclusions=**/*_test.go,**/vendor/**

# Coverage exclusions - only Go code should be in coverage metrics
sonar.coverage.exclusions=**/*.yaml,**/*.yml,**/Dockerfile,**/*.mod,**/*.sum

# Test file patterns
sonar.test.inclusions=**/*_test.go
