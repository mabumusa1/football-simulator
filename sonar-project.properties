# SonarCloud Configuration
sonar.projectKey=mabumusa1_football-simulator
sonar.organization=mabumusa

# Project metadata
sonar.projectName=football-simulator
sonar.projectVersion=1.0

# Source directories
sonar.sources=apps/api,apps/consumer

# Encoding
sonar.sourceEncoding=UTF-8

# Go coverage report
sonar.go.coverage.reportPaths=coverage.out

# Exclusions (optional - exclude test files from analysis)
sonar.exclusions=**/*_test.go,**/vendor/**

# Test file patterns
sonar.test.inclusions=**/*_test.go
