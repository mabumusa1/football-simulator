# =============================================================================
# Prometheus Configuration
# =============================================================================
# Scrape configuration for Docker Swarm services
# =============================================================================

global:
  scrape_interval: 15s          # How often to scrape targets
  evaluation_interval: 15s       # How often to evaluate rules

  # Attach these labels to any time series or alerts
  external_labels:
    environment: production
    cluster: fanfinity-swarm

# =============================================================================
# Scrape Configurations
# =============================================================================
scrape_configs:
  # ---------------------------------------------------------------------------
  # Prometheus Self-Monitoring
  # ---------------------------------------------------------------------------
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: prometheus

  # ---------------------------------------------------------------------------
  # Traefik Metrics
  # ---------------------------------------------------------------------------
  - job_name: 'traefik'
    static_configs:
      - targets: ['traefik:8080']
        labels:
          service: traefik

  # ---------------------------------------------------------------------------
  # Go API Service (all replicas via Swarm DNS)
  # ---------------------------------------------------------------------------
  # 'tasks.go-api' resolves to ALL container IPs, not just the VIP
  - job_name: 'go-api'
    dns_sd_configs:
      - names:
          - 'tasks.go-api'
        type: 'A'
        port: 8080
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
      - target_label: service
        replacement: go-api

  # ---------------------------------------------------------------------------
  # Go Consumer Service (all replicas)
  # ---------------------------------------------------------------------------
  - job_name: 'go-consumer'
    dns_sd_configs:
      - names:
          - 'tasks.go-consumer'
        type: 'A'
        port: 8080
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
      - target_label: service
        replacement: go-consumer

  # ---------------------------------------------------------------------------
  # ClickHouse Metrics
  # ---------------------------------------------------------------------------
  # ClickHouse exposes Prometheus metrics on port 9363
  - job_name: 'clickhouse'
    static_configs:
      - targets: ['clickhouse:9363']
        labels:
          service: clickhouse

  # ---------------------------------------------------------------------------
  # Kafka Metrics (via JMX Exporter - optional)
  # ---------------------------------------------------------------------------
  # Uncomment if you add a JMX exporter sidecar to Kafka
  # - job_name: 'kafka'
  #   static_configs:
  #     - targets: ['kafka:7071']
  #       labels:
  #         service: kafka
