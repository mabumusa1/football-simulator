services:
  go-consumer:
    image: ${REGISTRY:-localhost:5000}/football-simulator-consumer:${VERSION:-latest}

    networks:
      - internal

    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC_EVENTS: football_simulator.events
      KAFKA_TOPIC_ENGAGEMENTS: football_simulator.engagements
      KAFKA_TOPIC_RETRY: football_simulator.retry
      KAFKA_TOPIC_DEAD: football_simulator.dead
      CONSUMER_GROUP: clickhouse-writer
      # Event consumer (low volume game events)
      CONSUMER_BATCH_SIZE: "500"
      CONSUMER_FLUSH_INTERVAL: "1s"
      CONSUMER_MAX_RETRIES: "3"
      CONSUMER_WORKER_COUNT: "2"
      # Engagement consumer (high volume - 100K+ viewers)
      ENGAGEMENT_BATCH_SIZE: "10000"
      ENGAGEMENT_FLUSH_INTERVAL: "100ms"
      ENGAGEMENT_WORKER_COUNT: "32"
      # ClickHouse
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "9000"
      CLICKHOUSE_DATABASE: football_simulator
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}

    deploy:
      replicas: 3
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
